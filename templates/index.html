<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <nav class="navbar-custom">
            <div class="nav-brand">RAG Assistant</div>
            <div class="nav-actions">
                <button class="btn-nav active" onclick="showSection('chat')">Chat</button>
                <button class="btn-nav" onclick="showSection('upload')">Upload</button>
                <button class="btn-nav" onclick="showSection('scrape')">Scrape</button>
            </div>
        </nav>

        <div id="chat-section" class="section active">
            <div class="chat-container" id="chat-box">
                <div class="message system-message">
                    <div class="message-content">Ask about Python, Java, C programming or upload your own documents.</div>
                </div>
            </div>
            <div class="input-bar">
                <div class="input-wrapper">
                    <textarea id="query-input" placeholder="Type your question..." rows="1"
                        onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                    <button class="btn-send" onclick="sendMessage()" id="send-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="input-hint">Press Enter to send &middot; Shift+Enter for new line</div>
            </div>
        </div>

        <div id="upload-section" class="section">
            <div class="panel">
                <h3 class="panel-title">Upload Documents</h3>
                <p class="panel-desc">Supported formats: PDF, DOCX, CSV, XLSX, TXT, MD</p>
                <div class="drop-zone" id="drop-zone" ondrop="handleDrop(event)" ondragover="event.preventDefault(); this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')">
                    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <p>Drag & drop files here or click to browse</p>
                    <input type="file" id="file-input" multiple accept=".pdf,.docx,.csv,.xlsx,.txt,.md"
                        onchange="handleFiles(this.files)" style="display:none">
                    <button class="btn-outline" onclick="document.getElementById('file-input').click()">Choose Files</button>
                </div>
                <div id="upload-status" class="status-area"></div>
            </div>
        </div>

        <div id="scrape-section" class="section">
            <div class="panel">
                <h3 class="panel-title">Web Scraper</h3>
                <p class="panel-desc">Scrape programming docs or add custom URLs</p>
                <div class="scrape-actions">
                    <button class="btn-primary" onclick="scrapeAll()">Scrape Default Sources</button>
                </div>
                <div class="custom-scrape">
                    <input type="text" id="scrape-url" placeholder="Enter URL to scrape..." class="input-field">
                    <input type="text" id="scrape-name" placeholder="Label (optional)" class="input-field" style="width:150px">
                    <button class="btn-primary" onclick="scrapeUrl()">Scrape URL</button>
                </div>
                <div id="scrape-status" class="status-area"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
