services:
  - type: web
    name: rag-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
    disk:
      name: chromadb
      mountPath: /app/chroma_db
      sizeGB: 1
